name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        **Important:** this app handles location history. Never attach your real
        Timeline export, real place names, real coordinates, or screenshots
        containing them — issues are public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Import an export containing … (use synthetic data!)
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import/parsing of Timeline exports
        - Visits / places / trips display
        - Export/backup archive
        - Build or installation
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 141 on Fedora Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Paste any browser console errors here. Redact anything location-related first.
      render: shell
